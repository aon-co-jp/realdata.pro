[workspace]
resolver = "2"
members = ["crates/rrd-core", "crates/rrd-compute", "crates/rrd-render", "crates/rrd-server", "crates/rrd-cli"]
# .deps/ は deps.lock で固定した兄弟リポジトリ(それぞれ独自の workspace を持つ)。
exclude = [".deps"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aon-co-jp/realdata.pro"
rust-version = "1.75"
