# realdata.pro が依存する aon-co-jp エコシステムの兄弟リポジトリ(コミット固定)。
#
# 設計思想: ビルドはユーザーの作業ツリー(F:\ 直下の各リポジトリ)を一切参照・変更しない。
# scripts/fetch-deps.{sh,ps1} がここに書かれたコミットを .deps/<名前> に取得し、
# Cargo.toml のパス依存はすべて .deps/ を指す。更新はこのファイルの rev を書き換えて
# fetch-deps を再実行し、テストが通ることを確認してからコミットする。
#
